<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>싹싹김치 비디오 압축기</title>
<style>
  :root{--bg:#faf7f1;--card:#fff;--line:#e8e2d8;--ink:#2b2620;--muted:#8a8177;--accent:#e85d2c;--accent2:#f6863c;--green:#2f8f4e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
  h1{font-size:22px;display:flex;align-items:center;gap:8px}
  .sub{font-size:12.5px;color:var(--muted);margin:4px 0 20px}
  .drop{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:34px;text-align:center;cursor:pointer;transition:.15s}
  .drop.over,.drop:hover{border-color:var(--accent);background:#fff8f3}
  .drop b{display:block;font-size:15px}
  .drop span{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
  .fname{font-weight:700;font-size:13.5px;word-break:break-all}
  .fmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .frow{display:flex;align-items:center;gap:12px}
  .frow .grow{flex:1;min-width:0}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
  select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;font-size:13.5px;margin:14px 0}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:disabled{background:var(--line);color:var(--muted);cursor:default}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .row{display:flex;gap:10px;align-items:center;margin-top:4px}
  .st{font-size:12px;color:var(--muted)}
  .st.done{color:var(--green);font-weight:700}
  .st.err{color:#c0392b}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f0ebe2;color:var(--muted)}
  .badge.ok{background:#e2f2e7;color:var(--green)}
  .badge.err{background:#f9e2e0;color:#c0392b}
  /* 하단 자매제품 띠배너 */
  .adbar{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 16px;border-radius:14px;cursor:pointer;
         background:linear-gradient(108deg,#1b2230,#28324c 58%,#3a4470);transition:filter .12s}
  .adbar:hover{filter:brightness(1.08)}
  .adtag{position:absolute;top:6px;right:8px;font-size:8px;font-weight:800;letter-spacing:.1em;
         color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:0 4px}
  .ad-o{flex:none;width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,#ff8a4c,#ff5a2e);
        display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:900;
        box-shadow:0 3px 10px rgba(255,90,46,.4)}
  .ad-txt{flex:1;min-width:0}
  .ad-t1{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:.03em}
  .ad-t2{font-size:11.5px;color:#cdd3e2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ad-cta{flex:none;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(150deg,#ff8a4c,#ff5a2e);
          border-radius:99px;padding:7px 14px}
</style>
</head>
<body>
  <h1>🥬 싹싹김치 비디오 압축기</h1>
  <p class="sub">파일이 컴퓨터 밖으로 나가지 않아요 — 100% 로컬 처리 · 무료</p>

  <div class="drop" id="drop" role="button" tabindex="0">
    <b>동영상 파일을 놓거나 클릭해서 선택</b>
    <span>mp4 · mkv · mov · avi · webm — 여러 개 가능</span>
  </div>

  <select id="preset"></select>

  <div class="row">
    <button class="btn btn-primary" id="go" disabled>압축 시작</button>
    <button class="btn btn-ghost" id="cancelBtn" disabled>취소</button>
    <span class="st" id="encInfo"></span>
  </div>

  <div id="list"></div>

  <div class="adbar" id="adbar" role="link" tabindex="0" title="자매 제품 — 프리미어 컷편집 가속기">
    <span class="adtag">AD</span>
    <div class="ad-o">O</div>
    <div class="ad-txt">
      <div class="ad-t1">OFFCUT STUDIO</div>
      <div class="ad-t2">긴 영상, 컷만 쏙쏙 뽑는 프리미어 편집 가속기</div>
    </div>
    <span class="ad-cta">보러가기</span>
  </div>

<script src="app.js"></script>
</body>
</html>
